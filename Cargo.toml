[package]
name = "claude-account"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Cross-platform Claude Code account switcher for Linux and macOS"
authors = ["Hamza Rehman"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/hamzarehmandeveloper/claude-account"
repository = "https://github.com/hamzarehmandeveloper/claude-account"
keywords = ["claude-code", "profiles", "account-switcher", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
tempfile = "3.19"
